text = "extern int qs64_speed_repeat(uint8_t*); extern void qs64_speed_cancel(uint8_t*); if (qs64_speed_repeat(rdram)) { recomp_context qs64_saved_context = *ctx; int qs64_door_hit = 0; if (!(MEM_HU(0x74, 0x8007BAB8) & 1)) { ctx->f12.u32l = MEM_W(0x14, 0x8007BAB8); ctx->f14.u32l = MEM_W(0x1C, 0x8007BAB8); ctx->r6 = MEM_W(0x24, 0x8007BAB8); func_8000FDE0(rdram, ctx); qs64_door_hit = ctx->r2 != 0; } *ctx = qs64_saved_context; if (!qs64_door_hit) goto qs64_speed_simulation; qs64_speed_cancel(rdram); } qs64_pause_render_frame:;"

