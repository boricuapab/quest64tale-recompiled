text = "MEM_W(0, 0x8007B2F8) = 0; MEM_W(0, 0x80087200) = 0; extern int qs64_battle_pause_input(uint8_t*); int qs64_pause_action = qs64_battle_pause_input(rdram); if (qs64_pause_action == 3) goto L_80001FF4; if (qs64_pause_action == 2) func_8001CFE8(rdram, ctx); if (qs64_pause_action == 1) goto qs64_pause_render_frame; extern void qs64_speed_begin(uint8_t*); qs64_speed_begin(rdram); qs64_speed_simulation:;"

