# Config file for Quest 64 Recompilation

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
# elf_path = "quest64.elf"
rom_file_path = "quest64.us.z64"
symbols_file_path = "Quest64Syms/dump.toml"
output_func_path = "RecompiledFuncs"

[patches]
stubs = [
    "func_800471B0", #some libleo function
    "func_8004793C", #another libleo function
    "initPFSPaks", #is this ever actually called??
    "func_8003C530",
]

ignored = [
    "__osBlockSum",
    "__osPfsReleasePages",
    "__osPfsDeclearPage",
]

# Play before the native boss encounter camera/dialogue setup.
[[patches.hook]]
func = "func_8000BA4C"
before_vram = 0x8000BA4C
text = "extern void qs64_fmv_boss_event(uint8_t*, int, int); qs64_fmv_boss_event(rdram, 0, (int)ctx->r4);"

# Arm only on a successful native boss victory, never an escape or loaded save.
[[patches.hook]]
func = "func_8000BA0C"
before_vram = 0x8000BA0C
text = "extern void qs64_fmv_boss_event(uint8_t*, int, int); qs64_fmv_boss_event(rdram, 1, (int)ctx->r4);"

# This branch runs only after action 15's celebration timer ends and clears.
[[patches.hook]]
func = "func_80004BD0"
before_vram = 0x80004D10
text = "extern void qs64_fmv_boss_event(uint8_t*, int, int); if ((uint32_t)ctx->r7 == 0x8007BACC) qs64_fmv_boss_event(rdram, 2, -1);"

